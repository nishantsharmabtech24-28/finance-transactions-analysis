<title>Finance Dashboard 2023-2024</title>
<style>
:root{--bg:#f6f7fa;--card:#fff;--ink:#1d2433;--muted:#667085;--line:#e4e7ec;--rev:#2a5db0;--exp:#d9822b;--neg:#c0392b;--navy:#1f3864;--chip:#eef2f8}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#171c26;--ink:#e8ecf3;--muted:#97a1b3;--line:#2a3140;--rev:#6ea0ec;--exp:#f0a35a;--neg:#ef6b5b;--navy:#9db8e8;--chip:#202838}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{padding:16px 16px 4px;max-width:1100px;margin:0 auto}
h1{margin:0;font-size:20px;color:var(--navy)}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
main{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;flex:1 1 100px}
select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
select:disabled{opacity:.5}
nav{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px}
nav button{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;white-space:nowrap;cursor:pointer}
nav button[aria-selected=true]{background:var(--navy);color:var(--bg);border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--chip);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy)}
.kpi .d{font-size:12px;color:var(--muted)}
.d.up{color:var(--rev)}.d.down{color:var(--neg)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card h2{margin:0 0 2px;font-size:15px}
.card .note{font-size:12px;color:var(--muted);margin:0 0 8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font-size:12px}
svg .lab{fill:var(--ink)}
svg .grid line{stroke:var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
td.heat{text-align:center;color:#111;font-weight:600}
.callout{background:var(--chip);border-radius:10px;padding:10px 12px;font-size:13px}
.callout b{color:var(--navy)}
.bad{color:var(--neg)}
footer{max-width:1100px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:12px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}.grid.two{grid-template-columns:1fr 1fr}.filters label{flex:0 1 180px}}
</style>

   <div class="card"><h2>Profit margin by department and region</h2><p class="note">Net profit divided by revenue. Respects the Year filter; the Region and Department filters are not used on this page.</p>${h}</div>
   <div class="grid two">
   <div class="card"><h2>Top 10 department-region pairs by net profit</h2>${t}<p class="note" style="margin-top:8px">Lowest three: ${worst}</p></div>
   <div class="card"><h2>Revenue by category</h2>${hBars(cat.map(x=>x[0]),[{vals:cat.map(x=>x[1]),color:'var(--rev)'}],k)}</div>
   </div></div>`;
}
// ---------- wiring ----------
function render(){
  const rs=sel();const rv=sum(rs,'R'),ex=sum(rs,'E'),nt=rv-ex;
  let prev=null;if(S.year==='2024'){prev=sel({year:false}).filter(r=>r.y===2023)}
  const dl=(v,p,inv)=>{if(!prev||!p)return '<div class="d">&nbsp;</div>';const c=v/p-1;const good=inv?c<0:c>0;return `<div class="d ${good?'up':'down'}">${sgn(c)} vs 2023</div>`};
  const pr=prev?{R:sum(prev,'R'),E:sum(prev,'E'),N:net(prev)}:{};
  $('#kpis').innerHTML=
   `<div class="kpi"><div class="l">Total revenue</div><div class="v">${fmt(rv)}</div>${dl(rv,pr.R)}</div>
    <div class="kpi"><div class="l">Total expense</div><div class="v">${fmt(ex)}</div>${dl(ex,pr.E,true)}</div>
    <div class="kpi"><div class="l">Net profit</div><div class="v">${fmt(nt)}</div>${dl(nt,pr.N)}</div>
    <div class="kpi"><div class="l">Profit margin</div><div class="v">${rv?pc(nt/rv):'-'}</div><div class="d">${rs.length.toLocaleString()} transactions</div></div>`;
  $('#sub').textContent=`${S.year==='All'?'2023-2024':S.year} | ${S.region==='All'?'All regions':S.region} | ${S.dept==='All'?'All departments':S.dept}`;
  $('#page').innerHTML=S.page==='overview'?pageOverview():S.page==='why'?pageWhy():pageDept();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.p===S.page));
  $('#fy').disabled=S.page==='why';
  $('#fr').disabled=S.page==='dept';$('#fd').disabled=S.page==='dept';
}
function fill(id,vals,key){const e=$(id);e.innerHTML=['All',...vals].map(v=>`<option>${v}</option>`).join('');e.onchange=()=>{S[key]=e.value;render()}}
fill('#fy',['2023','2024'],'year');fill('#fr',DATA.regions,'region');fill('#fd',DATA.depts,'dept');
$('#tabs').innerHTML=PAGES.map(([p,l])=>`<button role="tab" data-p="${p}">${l}</button>`).join('');
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{S.page=b.dataset.p;render()});
render();
</script>
</body>
</html>
